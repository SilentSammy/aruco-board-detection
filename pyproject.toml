[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aruco-board-detection"
version = "0.1.0"
description = "Focused ArUco grid-board detection and pose estimation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
pdf = [
    "Pillow>=10",
    "reportlab>=4",
]
dev = [
    "pytest>=7",
    "Pillow>=10",
    "reportlab>=4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aruco_board_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
